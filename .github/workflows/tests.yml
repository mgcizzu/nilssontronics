name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    env:
      # Qt tests run headless with the plain image view; ndv/vispy needs a real GL display.
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1

      - name: Install
        run: python -m pip install -e ".[hardware,qt,test]"

      # tests/test_mmcore_demo.py skips itself here: no Micro-Manager adapters are installed.
      - name: Test
        run: python -m pytest -ra
